name: eticketing

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: eticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      TICKETS_OWNER_PASSWORD: ${TICKETS_OWNER_PASSWORD:?set TICKETS_OWNER_PASSWORD in infra/.env}
      TICKETS_APP_PASSWORD: ${TICKETS_APP_PASSWORD:?set TICKETS_APP_PASSWORD in infra/.env}
      PAYMENTS_OWNER_PASSWORD: ${PAYMENTS_OWNER_PASSWORD:?set PAYMENTS_OWNER_PASSWORD in infra/.env}
      PAYMENTS_APP_PASSWORD: ${PAYMENTS_APP_PASSWORD:?set PAYMENTS_APP_PASSWORD in infra/.env}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:?set LEDGER_OWNER_PASSWORD in infra/.env}
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:?set LEDGER_APP_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      # TCP, so the probe stays unhealthy while the init scripts run on the
      # socket-only temporary server.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d eticketing']
      interval: 5s
      retries: 20

volumes:
  pgdata: {}
