# Included in every location that sets its own add_header: nginx drops the
# server-level add_header lines inside such a location, so they are repeated here.
# style-src has no 'unsafe-inline': the SPA ships CSS files only and no style attributes.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
