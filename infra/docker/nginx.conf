# SPA server: static files, a same-origin /api proxy to the gateway, and the history
# fallback for deep links. Replaces the image's conf.d/default.conf.
server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript image/svg+xml;
  gzip_min_length 256;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # The trailing slash on proxy_pass strips the /api prefix. X-Forwarded-For is set to the
  # peer address (not appended), so a client cannot spoof it.
  location /api/ {
    proxy_pass http://gateway:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 10s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
