# Prod only (HTTPS). HSTS for the SPA HTML; the API already gets it from helmet,
# so this middleware is attached to the `web` Ingress only (see the template).
# Conservative: no includeSubdomains, no preload, header only on HTTPS responses.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: eticketing
spec:
  headers:
    stsSeconds: 15552000
    stsIncludeSubdomains: false
    stsPreload: false
    forceSTSHeader: false
