apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/zainelabdeen/e-ticketing/gateway
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: '3000'
            - name: TICKET_SERVICE_URL
              value: http://ticket-service:3001
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:3002
            - name: LEDGER_SERVICE_URL
              value: http://ledger-service:3003
            - name: PUBLIC_API_KEY_TICKET
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: PUBLIC_API_KEY_TICKET }
            - name: PUBLIC_API_KEY_PAYMENT
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: PUBLIC_API_KEY_PAYMENT }
            - name: PUBLIC_API_KEY_LEDGER
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: PUBLIC_API_KEY_LEDGER }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: JWT_SECRET }
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: ADMIN_EMAIL }
            - name: ADMIN_PASSWORD_HASH_B64
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: ADMIN_PASSWORD_HASH_B64 }
            - name: WEB_ORIGIN
              value: http://localhost:8081
            # One proxy hop: Traefik, with externalTrafficPolicy Local so it sees the client IP.
            - name: TRUST_PROXY
              value: '1'
            - name: SWAGGER_ENABLED
              value: 'true'
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
