# Traefik applies a middleware per router, and StripPrefix must not touch the
# SPA, so the API and the SPA are two Ingress objects (ADR-0026). The longer
# /api prefix wins over /.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
spec:
  stripPrefix:
    prefixes:
      - /api
---
# Outer limit per client IP. depth 0 uses the TCP peer address, which is the
# real client with externalTrafficPolicy Local, so a spoofed X-Forwarded-For
# cannot pick another bucket.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-ratelimit
spec:
  rateLimit:
    average: 20
    burst: 50
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 0
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: eticketing-strip-api@kubernetescrd,eticketing-api-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
