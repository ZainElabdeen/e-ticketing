apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  labels:
    app.kubernetes.io/name: ticket-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ticket-service
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  labels:
    app.kubernetes.io/name: ticket-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-service
    spec:
      # Longer than the host's 15 s shutdown timeout (as compose stop_grace_period).
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-postgres
          image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
          command: [sh, -c, 'until pg_isready -h postgres -U postgres; do sleep 2; done']
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: migrate
          image: ghcr.io/zainelabdeen/e-ticketing/migrate-tickets
          env:
            - name: TICKETS_OWNER_PASSWORD
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: TICKETS_OWNER_PASSWORD }
            - name: HOME
              value: /tmp
            - name: MIGRATION_DATABASE_URL
              value: postgresql://tickets_owner:$(TICKETS_OWNER_PASSWORD)@postgres:5432/eticketing?schema=tickets
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ticket-service
          image: ghcr.io/zainelabdeen/e-ticketing/ticket-service
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: '3001'
            - name: TICKETS_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: TICKETS_APP_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://tickets_app:$(TICKETS_APP_PASSWORD)@postgres:5432/eticketing?schema=tickets
            - name: PUBLIC_API_KEY_TICKET
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: PUBLIC_API_KEY_TICKET }
            - name: INTERNAL_API_KEY_TICKET
              valueFrom:
                secretKeyRef: { name: eticket-secrets, key: INTERNAL_API_KEY_TICKET }
            - name: SWAGGER_ENABLED
              value: 'true'
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
