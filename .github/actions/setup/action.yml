name: Setup workspace
description: Install pnpm, Node (from .nvmrc), the .NET SDK (from global.json) and the pnpm dependencies.

inputs:
  dotnet:
    description: Install the .NET SDK pinned in apps/ticket-service-dotnet/global.json.
    default: 'true'

runs:
  using: composite
  steps:
    # pnpm must be on PATH before setup-node so that `cache: pnpm` can find the store.
    # The version comes from `packageManager` in the root package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - if: inputs.dotnet == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: apps/ticket-service-dotnet/global.json
    - run: pnpm install --frozen-lockfile
      shell: bash
