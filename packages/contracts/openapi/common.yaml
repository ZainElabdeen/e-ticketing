# Shared OpenAPI 3.0.3 components, referenced by every contract in this folder.
# Not a standalone API document: it has no paths. Lint the service files; Redocly
# resolves references into this file.
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: >
        Propagated end to end. The gateway keeps a client-supplied UUID and
        replaces anything else with a new UUID v4. Echoed in error bodies.
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Request validation failed (code VALIDATION_ERROR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials (code UNAUTHORIZED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Valid key with the wrong scope for this route (code FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (code NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error (code INTERNAL_ERROR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Health:
      description: Health report (exempt from the error envelope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Health' }

  schemas:
    Error:
      type: object
      required: [statusCode, code, message, correlationId]
      properties:
        statusCode: { type: integer, example: 409 }
        code:
          type: string
          description: Stable machine-readable error code; clients switch on it.
          example: QUOTA_EXCEEDED
        message: { type: string }
        correlationId: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, error] }
        details: { type: object, additionalProperties: true }

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      example: AED

    AmountMinor:
      type: integer
      format: int64
      minimum: 1
      description: Integer minor units (1 AED = 100 fils).
