# SonarCloud analysis of everything except the .NET Ticket Service. The organization and project
# key are passed by the workflow (repository variables), so they are not set here. The .NET
# Ticket Service is a separate SonarCloud project analysed with dotnet-sonarscanner (ADR-0025).
#
# SonarCloud analyses the whole repository and ignores sonar.sources / sonar.tests, so scope is
# set with exclusions only.

# Not analysed: generated code, build output, the .NET project (own SonarCloud project), and test
# files (Sonar's automatic test detection misses some of these names).
sonar.exclusions=**/generated/**,**/dist/**,**/coverage/**,**/TestResults/**,apps/ticket-service-dotnet/**,**/*.spec.ts,**/*.int-spec.ts,**/*.contract-spec.ts,**/*.test.ts,**/*.test.tsx,**/*.test.mjs

# Analysed for issues, not counted for coverage: tooling that has no lcov report (infra and CI
# scripts, run by `node --test` without coverage), the test harness packages, and barrel files.
sonar.coverage.exclusions=infra/**,.github/**,packages/contract-tests/**,packages/testing/**,**/index.ts,**/*.config.*,**/*.cjs

sonar.javascript.lcov.reportPaths=apps/gateway/coverage/unit/lcov.info,apps/gateway/coverage/int/lcov.info,apps/payment-service/coverage/unit/lcov.info,apps/payment-service/coverage/int/lcov.info,apps/ledger-service/coverage/unit/lcov.info,apps/ledger-service/coverage/int/lcov.info,packages/nest-common/coverage/unit/lcov.info,apps/web/coverage/lcov.info

# Reviewed false positives:
#   ip      S1313  fixed IPs are the X-Forwarded-For values the rate-limit tests send.
#   pw      S2068  passwords in app tests are validation-test inputs, not credentials.
#   path*   S4036  tests and local tooling spawn `pnpm` from the developer's or runner's PATH.
#   roles   S2068  00-roles.sh passes passwords from environment variables to psql; none is
#                  hard-coded.
#   smoke   jssecurity  smoke.mjs is a local CLI; its URL and log values come from the
#                  operator's own environment, not from untrusted input.
#   plsql   the SQL migrations are PostgreSQL; the PL/SQL (Oracle) rules do not apply.
sonar.issue.ignore.multicriteria=ip,pw,path,pathjs,pathts,roles,smoke,plsql
sonar.issue.ignore.multicriteria.ip.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.ip.resourceKey=apps/*/test/**
sonar.issue.ignore.multicriteria.pw.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.pw.resourceKey=apps/*/test/**
sonar.issue.ignore.multicriteria.path.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=apps/*/test/**
sonar.issue.ignore.multicriteria.pathjs.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.pathjs.resourceKey=infra/scripts/**
sonar.issue.ignore.multicriteria.pathts.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.pathts.resourceKey=packages/testing/**
sonar.issue.ignore.multicriteria.roles.ruleKey=secrets:S2068
sonar.issue.ignore.multicriteria.roles.resourceKey=infra/postgres/init/00-roles.sh
sonar.issue.ignore.multicriteria.smoke.ruleKey=jssecurity:*
sonar.issue.ignore.multicriteria.smoke.resourceKey=infra/scripts/smoke.mjs
sonar.issue.ignore.multicriteria.plsql.ruleKey=plsql:*
sonar.issue.ignore.multicriteria.plsql.resourceKey=**/migrations/**
