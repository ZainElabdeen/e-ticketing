# SonarCloud analysis of the TypeScript code. The organization and project key are passed by
# the workflow (repository variables), so they are not set here. The .NET Ticket Service is a
# separate SonarCloud project analysed with dotnet-sonarscanner (ADR-0025).
sonar.sources=apps/gateway/src,apps/ticket-service/src,apps/payment-service/src,apps/ledger-service/src,apps/web/src,packages/nest-common/src
sonar.tests=apps/gateway/src,apps/ticket-service/src,apps/payment-service/src,apps/ledger-service/src,apps/web/src,packages/nest-common/src,apps/gateway/test,apps/ticket-service/test,apps/payment-service/test,apps/ledger-service/test
sonar.test.inclusions=**/*.spec.ts,**/*.int-spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/generated/**,**/dist/**,**/*.spec.ts,**/*.int-spec.ts,**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=apps/gateway/coverage/unit/lcov.info,apps/gateway/coverage/int/lcov.info,apps/ticket-service/coverage/unit/lcov.info,apps/ticket-service/coverage/int/lcov.info,apps/payment-service/coverage/unit/lcov.info,apps/payment-service/coverage/int/lcov.info,apps/ledger-service/coverage/unit/lcov.info,apps/ledger-service/coverage/int/lcov.info,packages/nest-common/coverage/unit/lcov.info,apps/web/coverage/lcov.info
